[package]
name = "tmux-link-mobile"
version = "0.1.1"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
russh = { version = "0.65.2", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "io-util"] }

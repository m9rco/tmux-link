[package]
name = "tmux-link-mobile"
version = "0.5.1"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "io-util"] }
tmux-link = { path = "..", features = ["tls"] }

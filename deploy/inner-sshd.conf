# Standalone sshd instance on the Linux tmux host. Replace alice with the tmux owner.
Port 2201
ListenAddress 127.0.0.1
HostKey /etc/tmux-link/host_ed25519
PidFile /run/tmux-link-inner.pid
AuthorizedKeysFile /etc/tmux-link/phone.keys
AllowUsers alice
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
DisableForwarding yes
PermitTunnel no
PermitUserRC no
PermitUserEnvironment no
PermitTTY yes
ForceCommand /usr/local/bin/agent attach
MaxSessions 1
LoginGraceTime 20
MaxStartups 4:50:16
ClientAliveInterval 30
ClientAliveCountMax 2

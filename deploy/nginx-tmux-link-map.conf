# Include in the http context (e.g. /etc/nginx/conf.d/tmux-link-mtls-map.conf).
# An empty authorized-routes.map denies all terminal traffic.
map "$ssl_client_verify:$ssl_client_serial:$uri" $tmux_link_authorized {
    default 0;
    include /etc/nginx/tmux-link/authorized-routes.map;
}

# A currently authorized primary device may approve its own outbound hosts.
map "$ssl_client_verify:$ssl_client_serial:/tmux-link/primary" $tmux_link_pair_authorized {
    default 0;
    include /etc/nginx/tmux-link/authorized-routes.map;
}
limit_req_zone $binary_remote_addr zone=tmux_link_pairing:1m rate=2r/s;

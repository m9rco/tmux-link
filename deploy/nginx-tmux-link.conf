# Include inside the HTTPS server block. Install nginx-tmux-link-map.conf in
# the http context first. Other HTTPS locations can still accept ordinary TLS.
ssl_client_certificate /etc/nginx/tmux-link/device-ca.pem;
ssl_verify_client optional;
ssl_verify_depth 1;

location = /tmux-link/register {
    limit_req zone=tmux_link_pairing burst=10 nodelay;
    proxy_set_header X-Tmux-Device "";
    include /etc/nginx/tmux-link/broker-proxy.conf;
}

location = /tmux-link/tunnel {
    limit_req zone=tmux_link_pairing burst=20 nodelay;
    proxy_set_header X-Tmux-Device "";
    include /etc/nginx/tmux-link/broker-proxy.conf;
}

location = /tmux-link/pair {
    if ($tmux_link_pair_authorized = 0) { return 403; }
    proxy_set_header X-Tmux-Device $ssl_client_serial;
    include /etc/nginx/tmux-link/broker-proxy.conf;
}

location ~ "^/tmux-link/session/[a-f0-9]{32}$" {
    if ($tmux_link_pair_authorized = 0) { return 403; }
    proxy_set_header X-Tmux-Device $ssl_client_serial;
    include /etc/nginx/tmux-link/broker-proxy.conf;
}

location ~ "^/tmux-link(?:/[A-Za-z0-9_-]{1,64})?$" {
    if ($tmux_link_authorized = 0) { return 403; }
    proxy_pass http://127.0.0.1:7682;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          echo "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: shellcheck install.sh scripts/*.sh
      - run: scripts/test-install.sh
      - name: HTTPS installer integration
        run: python3 scripts/test-download.py
      - run: scripts/e2e-linux.sh
  linux:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"
          echo "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin" >> "$GITHUB_PATH"
      - name: Build Linux package
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          cargo build --locked --release -p tmux-link --bins --target "${{ matrix.target }}"
          mkdir -p package/bin package/share/tmux-link dist
          cp target/${{ matrix.target }}/release/{agent,center} package/bin/
          cp -R deploy package/share/tmux-link/
          cp README.md package/share/tmux-link/
          tar -C package -czf dist/tmux-link-linux-${{ matrix.arch }}.tar.gz .
      - name: Install and execute built package
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ./install.sh --from-dir "$PWD/dist" --prefix "$RUNNER_TEMP/tmux-link" --role both
          test -x "$RUNNER_TEMP/tmux-link/bin/tmux-link-agent"
          test -x "$RUNNER_TEMP/tmux-link/bin/tmux-link-center"
          set +e
          "$RUNNER_TEMP/tmux-link/bin/tmux-link-agent" > smoke.log 2>&1
          result=$?
          set -e
          test "$result" = 1
          grep -q 'usage: agent' smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  macos:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Build macOS package
        run: |
          cargo build --locked --release -p tmux-link --bins --target "${{ matrix.target }}"
          mkdir -p package/bin package/share/tmux-link dist
          cp target/${{ matrix.target }}/release/{agent,center} package/bin/
          cp -R deploy package/share/tmux-link/
          cp README.md package/share/tmux-link/
          tar -C package -czf dist/tmux-link-macos-${{ matrix.arch }}.tar.gz .
      - name: macOS installer integration
        if: matrix.arch == 'aarch64'
        run: |
          scripts/test-install.sh
          python3 scripts/test-download.py
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
          ./install.sh --from-dir "$PWD/dist" --prefix "$RUNNER_TEMP/tmux-link" --role agent
          set +e
          "$RUNNER_TEMP/tmux-link/bin/tmux-link-agent" > smoke.log 2>&1
          result=$?
          set -e
          test "$result" = 1
          grep -q 'usage: agent' smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - run: scripts/build-ios.sh device
      - run: scripts/build-ios.sh simulator
      - name: Package unsigned iOS builds
        run: |
          mkdir dist
          ditto -c -k --keepParent target/xcode/Build/Products/Release-iphoneos/TmuxLink.app dist/tmux-link-ios-unsigned.zip
          ditto -c -k --keepParent target/xcode/Build/Products/Release-iphonesimulator/TmuxLink.app dist/tmux-link-ios-simulator-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, linux, macos, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp install.sh dist/
          (cd dist && sha256sum *.tar.gz *.zip install.sh > SHA256SUMS)
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes

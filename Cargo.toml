[workspace]
members = ["mobile"]
resolver = "2"

[package]
name = "tmux-link"
version = "0.2.0"
edition = "2024"

[dependencies]
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }

[features]
tls = ["tokio-tungstenite/rustls-tls-webpki-roots", "dep:rustls"]

[dependencies.futures-util]
version = "0.3"
features = ["sink"]

[dependencies.tokio-tungstenite]
version = "0.29"

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
optional = true

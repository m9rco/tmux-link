[workspace]
members = ["mobile"]
resolver = "2"

[package]
name = "tmux-link"
version = "0.4.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"
fs2 = "0.4"
percent-encoding = "2.3"
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }

[features]
default = ["tls"]
tls = ["tokio-tungstenite/rustls-tls-webpki-roots", "dep:rustls", "dep:webpki-roots"]

[dependencies.futures-util]
version = "0.3"
features = ["sink"]

[dependencies.tokio-tungstenite]
version = "0.29"

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
optional = true

[dependencies.webpki-roots]
version = "1"
optional = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

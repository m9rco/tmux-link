<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:">
  <link rel="stylesheet" href="xterm.css">
  <style>
    @font-face {
      font-family: 'Terminal Symbols';
      src: url('terminal-symbols.woff2') format('woff2');
      unicode-range: U+E000-F8FF;
    }
    #term { touch-action: manipulation; }
    .terminal-redraw {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      max-height: 100%;
      overflow: hidden;
      pointer-events: none;
      background: #0a141a;
    }
    html, body, #term {
      margin: 0;
      height: 100%;
      overflow: hidden;
      color-scheme: dark;
      background: #0a141a;
      -webkit-text-size-adjust: 100%;
    }
  </style>
</head>
<body>
  <div id="term"></div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script src="addon-unicode-graphemes.js"></script>
  <script src="terminal-input.js"></script>
  <script src="screen.js"></script>
</body>
</html>
